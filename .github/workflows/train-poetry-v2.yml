# 训练诗词检测模型 v2（加入唐宋古人作品作人写样本、加入 DeepSeek / Kimi / 文心一言写的诗词作 AI 样本），
# 发布到本仓库 Release（poetry-classifier-v2）。v1（poetry-classifier-v1）保持不变，评估达标后才会切换。
name: 训练诗词检测模型 v2

on:
  push:
    branches: [main]
    paths:
      - "server/tools/train_poetry2.py"
      - "server/tools/data/ai_user_poem_*.txt"
      - ".github/workflows/train-poetry-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: train-poetry-v2
  cancel-in-progress: true

env:
  RELEASE_TAG: poetry-classifier-v2

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: 安装依赖
        run: |
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r server/requirements.txt openpyxl opencc-python-reimplemented
      - name: 缓存底座模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chinese-roberta-wwm-ext
      - name: 下载底座模型与数据集
        run: |
          python server/download_models.py hfl/chinese-roberta-wwm-ext
          git clone --depth 1 https://github.com/VelikayaScarlet/ChangAn /tmp/changan
          git clone --depth 1 --filter=blob:none --sparse https://github.com/chinese-poetry/chinese-poetry /tmp/cpoetry
          (cd /tmp/cpoetry && git sparse-checkout set --no-cone "/全唐诗/唐诗三百首.json" "/宋词/宋词三百首.json" "/全唐诗/poet.tang.*.json" "/宋词/ci.song.*.json")
          ls /tmp/cpoetry/全唐诗 | wc -l; ls /tmp/cpoetry/宋词 | wc -l
      - name: 训练（约 2–4 小时）
        env:
          TORCH_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python -u server/tools/train_poetry2.py --changan /tmp/changan --cpoetry /tmp/cpoetry --out /tmp/poetry-classifier \
            --epochs 2 --time-budget-min 280
      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat /tmp/poetry-classifier/training_result.json >> "$GITHUB_STEP_SUMMARY"
          tar czf poetry-classifier.tar.gz -C /tmp poetry-classifier
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "诗词 AI 检测模型 v2" \
              --notes "由 server/tools/train_poetry2.py 训练：ChangAn + 唐宋古人作品（人写）+ DeepSeek / Kimi / 文心一言诗词（AI）。"
          gh release upload "$RELEASE_TAG" poetry-classifier.tar.gz --clobber
