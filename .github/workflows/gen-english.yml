# 用国产大模型的 API 批量生成英文学术文字（DeepSeek / Kimi / 通义千问，有哪个密钥用哪个），
# 并抓取同题材的 arXiv 真人摘要，结果提交到 server/tools/data/gen_en/，供训练英文检测模型使用。
# 只能在 Actions 页面手动运行（Run workflow）。
name: 生成英文 AI 训练数据

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "只用这几家（逗号分隔，如 doubao,qwen；留空 = 全部）"
        default: ""
      n_titles:
        description: "每家模型生成多少篇"
        default: "200"
      source:
        description: "arxiv（摘要）/ pubmed（农业、经济、医学等，含中国作者；生成整篇论文）/ pmc（只抓真人论文正文）/ translate（先写中文再译成英文）/ userstyle（一句中文指令直接写英文论文）/ genre（童话、读后感、清单、议论文等非论文体裁）"
        default: "pubmed"

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 生成
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY || secrets.MOONSHOT_API_KEY }}
          WENXIN_API_KEY: ${{ secrets.WENXIN_API_KEY || secrets.APIKey_20260930163541 || secrets.APIKEY_20260930163541 }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY || secrets.QWEN_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY || secrets.ARK_API_KEY }}
          DOUBAO_MODEL: ${{ secrets.DOUBAO_MODEL }}
          ONLY_PROVIDERS: ${{ github.event.inputs.providers }}
        run: |
          for v in DEEPSEEK_API_KEY KIMI_API_KEY WENXIN_API_KEY DASHSCOPE_API_KEY DOUBAO_API_KEY; do
            if [ -n "${!v}" ]; then echo "$v：已设置"; else echo "$v：未设置"; fi
          done
          python -u server/tools/gen_english_ai.py --n-titles "${{ github.event.inputs.n_titles || '200' }}" --source "${{ github.event.inputs.source || 'pubmed' }}" --time-budget-min 270
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/tools/data/gen_en
          git commit -m "Add generated English AI training data" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
