# 训练"英文第二分类器"（专门识别国产大模型写的英文），发布到本仓库 Release。
# 训练在 Modal 的 GPU 上进行（server/tools/train_english_modal.py；需要 MODAL_TOKEN_ID / MODAL_TOKEN_SECRET），
# 没有 Modal 密钥时退回 GitHub 的 CPU（数据量大时很慢）。在 Actions 页面手动运行。
name: 训练英文检测模型

on:
  workflow_dispatch:
    inputs:
      args:
        description: "传给 train_english.py 的额外参数（可留空）"
        default: ""
      tag:
        description: "发布到哪个 Release（默认 english-classifier-v3；对比实验用别的名字）"
        default: "english-classifier-v3"

permissions:
  contents: write

concurrency:
  group: train-english
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || 'english-classifier-v3' }}

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "modal==1.5.5"
      - name: 在 Modal GPU 上训练（约 20–60 分钟）
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          ls server/tools/data/gen_en || { echo "::error::还没有生成数据"; exit 1; }
          modal run server/tools/train_english_modal.py --args "${{ github.event.inputs.args }}"
          mkdir -p /tmp/x && tar xzf english-classifier.tar.gz -C /tmp/x
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/x/english-classifier/training_result.json"))
          for k in ("1pct", "5pct"):
              print(f"::notice title=英文第二分类器评估（误判率 {k}）::" + json.dumps(
                  {"auroc": r["test_auroc_all"], "ai_caught": r[f"ai_caught_at_{k}"], "human_flagged": r[f"human_flagged_at_{k}"], "user_docs": r.get(f"user_docs_flagged_at_{k}")},
                  ensure_ascii=False))
          PY
          cat /tmp/x/english-classifier/training_result.json >> "$GITHUB_STEP_SUMMARY"
      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "英文 AI 检测模型（国产大模型英文）" \
              --notes "由 server/tools/train_english.py 训练：arXiv / PubMed（含中国作者）/ MAGE 真人英文 vs DeepSeek、Kimi、文心一言等生成的英文论文。"
          gh release upload "$RELEASE_TAG" english-classifier.tar.gz --clobber
