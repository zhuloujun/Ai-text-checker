# 训练"英文第二分类器"（专门识别国产大模型写的英文），发布到本仓库 Release（english-classifier-v1）。
# 需要先运行"生成英文 AI 训练数据"，数据生成后在 Actions 页面手动运行本工作流。
name: 训练英文检测模型

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: train-english
  cancel-in-progress: true

env:
  RELEASE_TAG: english-classifier-v1

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: 安装依赖
        run: |
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r server/requirements.txt openpyxl
      - name: 缓存底座模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-roberta-base
      - name: 下载底座模型与 MAGE
        run: |
          python server/download_models.py FacebookAI/roberta-base
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download("yaful/MAGE", "valid.csv", repo_type="dataset", local_dir="/tmp/mage"))
          PY
      - name: 训练（约 1.5–4 小时）
        env:
          TORCH_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          ls server/tools/data/gen_en || { echo "::error::还没有生成数据"; exit 1; }
          python -u server/tools/train_english.py --mage-dir /tmp/mage --out /tmp/english-classifier --time-budget-min 280
      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat /tmp/english-classifier/training_result.json >> "$GITHUB_STEP_SUMMARY"
          tar czf english-classifier.tar.gz -C /tmp english-classifier
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "英文 AI 检测模型（国产大模型英文）" \
              --notes "由 server/tools/train_english.py 训练：arXiv 真人摘要 + MAGE vs DeepSeek / Kimi / 文心一言等生成的英文。"
          gh release upload "$RELEASE_TAG" english-classifier.tar.gz --clobber
