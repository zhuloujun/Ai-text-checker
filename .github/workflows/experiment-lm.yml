# 对比实验：换更大的打分语言模型（默认 Qwen2.5-1.5B）后，各文体的检测效果是否更好。
# 与"评估并生成默认校准"用完全相同的样本，结果只写到 server/tools/experiments/<名称>/，不改动线上使用的校准。
# 触发：修改本文件并推送，或在 Actions 页面手动运行（可填别的模型）。
name: 对比实验：更大的打分模型

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/experiment-lm.yml"
  workflow_dispatch:
    inputs:
      observer:
        description: "观察者（基础版）模型"
        default: "Qwen/Qwen2.5-1.5B"
      performer:
        description: "执行者（对话版）模型"
        default: "Qwen/Qwen2.5-1.5B-Instruct"
      name:
        description: "实验名称（结果目录名）"
        default: "qwen2.5-1.5b"

permissions:
  contents: write

concurrency:
  group: experiment-lm
  cancel-in-progress: true

env:
  OBSERVER_MODEL: ${{ github.event.inputs.observer || 'Qwen/Qwen2.5-1.5B' }}
  PERFORMER_MODEL: ${{ github.event.inputs.performer || 'Qwen/Qwen2.5-1.5B-Instruct' }}
  EXP_NAME: ${{ github.event.inputs.name || 'qwen2.5-1.5b' }}
  N_CAL: "800"
  N_TEST: "400"
  N_CSL: "240"
  N_EN_CAL: "600"
  N_EN_TEST: "300"
  N_CL_HUMAN: "240"
  N_CL_HUMAN_TEST: "160"
  N_PO_CAL: "800"
  N_PO_TEST: "600"

jobs:
  score:
    name: 打分 ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        part: [cal1, cal2, test, csl, cal1s, cal2s, tests, en_cal1, en_cal2, en_ood, en_para, cl_cal, cl_test, po_cal, po_test, po_story, po_classic]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: 安装依赖
        run: |
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r server/requirements.txt openpyxl opencc-python-reimplemented
      - name: 只加载这一份需要的分类器（省内存：两个 1.5B 模型约占 12 GB）
        run: |
          case "${{ matrix.part }}" in
            en_*) echo "ENABLE_CLASSIFIER=false" >> "$GITHUB_ENV" ;;
            *)    echo "ENABLE_EN_CLASSIFIER=false" >> "$GITHUB_ENV" ;;
          esac
      - name: 缓存模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-exp-${{ env.EXP_NAME }}-mpu-desklib
      - name: 下载模型
        working-directory: server
        run: |
          case "${{ matrix.part }}" in
            en_*) CLS=desklib/ai-text-detector-v1.01 ;;
            *)    CLS=yuchuantian/AIGC_detector_zhv3 ;;
          esac
          python download_models.py "$OBSERVER_MODEL" "$PERFORMER_MODEL" $CLS
      - name: 下载数据集（现代汉语：NLPCC 2025 Task 1）
        if: ${{ !startsWith(matrix.part, 'en_') && !startsWith(matrix.part, 'cl_') && !startsWith(matrix.part, 'po_') }}
        run: git clone --depth 1 https://github.com/NLP2CT/NLPCC-2025-Task1 /tmp/nlpcc
      - name: 下载数据集（英文：MAGE）
        if: ${{ startsWith(matrix.part, 'en_') }}
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          for f in ["test.csv", "test_ood_set_gpt.csv", "test_ood_set_gpt_para.csv"]:
              print(hf_hub_download("yaful/MAGE", f, repo_type="dataset", local_dir="/tmp/mage"))
          PY
      - name: 下载数据集（诗词）和诗词分类器
        if: ${{ startsWith(matrix.part, 'po_') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 https://github.com/VelikayaScarlet/ChangAn /tmp/changan
          git clone --depth 1 --filter=blob:none --sparse https://github.com/chinese-poetry/chinese-poetry /tmp/cpoetry
          (cd /tmp/cpoetry && git sparse-checkout set --no-cone "/全唐诗/唐诗三百首.json" "/宋词/宋词三百首.json")
          gh release download poetry-classifier-v1 -p poetry-classifier.tar.gz -D /tmp -R "${{ github.repository }}"
          tar xzf /tmp/poetry-classifier.tar.gz -C /tmp
          echo "POETRY_CLASSIFIER_MODEL=/tmp/poetry-classifier" >> "$GITHUB_ENV"
      - name: 下载数据集（文言：NiuTrans 古文语料，只取用到的书）
        if: ${{ startsWith(matrix.part, 'cl_') }}
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/NiuTrans/Classical-Modern /tmp/classical
          cd /tmp/classical
          git sparse-checkout set --no-cone $(python3 - <<'PY'
          import sys; sys.path.insert(0, "${{ github.workspace }}/server/tools")
          from evaluate import CLASSICAL_CAL_BOOKS, CLASSICAL_TEST_BOOKS
          print(" ".join(f"/古文原文/{b}/" for b in CLASSICAL_CAL_BOOKS + CLASSICAL_TEST_BOOKS))
          PY
          )
      - name: 打分
        working-directory: server
        env:
          TORCH_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          free -g
          python tools/evaluate.py --stage score --part ${{ matrix.part }} --data /tmp/nlpcc/data \
            --mage-dir /tmp/mage --classical-dir /tmp/classical --changan-dir /tmp/changan --cpoetry-dir /tmp/cpoetry --scores-dir /tmp/scores \
            --n-cal $N_CAL --n-test $N_TEST --n-csl $N_CSL --n-en-cal $N_EN_CAL --n-en-test $N_EN_TEST \
            --n-cl-human $N_CL_HUMAN --n-cl-human-test $N_CL_HUMAN_TEST --n-po-cal $N_PO_CAL --n-po-test $N_PO_TEST
      - uses: actions/upload-artifact@v4
        with:
          name: exp-scores-${{ matrix.part }}
          path: /tmp/scores/${{ matrix.part }}.json

  fit:
    name: 拟合、评估并与现用模型对比
    needs: score
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy openpyxl opencc-python-reimplemented
      - uses: actions/download-artifact@v4
        with:
          pattern: exp-scores-*
          path: /tmp/dl
          merge-multiple: true
      - name: 拟合与评估
        working-directory: server
        env:
          CLASSIFIER_MODEL: yuchuantian/AIGC_detector_zhv3
          EN_CLASSIFIER_MODEL: desklib/ai-text-detector-v1.01
          POETRY_CLASSIFIER_MODEL: /tmp/poetry-classifier
        run: |
          OUT=tools/experiments/$EXP_NAME
          mkdir -p $OUT/app $OUT/tools $OUT/scores
          cp /tmp/dl/*.json $OUT/scores/
          python tools/evaluate.py --stage fit --scores-dir $OUT/scores --out $OUT --target-fpr 0.05
      - name: 提交实验结果（不影响线上校准）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/result && cp -r server/tools/experiments/$EXP_NAME /tmp/result/
          git fetch origin main && git reset --hard origin/main
          mkdir -p server/tools/experiments && rm -rf server/tools/experiments/$EXP_NAME
          cp -r /tmp/result/$EXP_NAME server/tools/experiments/
          git add server/tools/experiments/$EXP_NAME
          git commit -m "Experiment results: $OBSERVER_MODEL + $PERFORMER_MODEL" || exit 0
          git push origin HEAD:main
