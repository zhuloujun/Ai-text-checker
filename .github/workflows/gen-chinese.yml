# 生成"中文第二分类器"训练数据：各家国产大模型写的中文散文 / 游记 / 读后感 / 议论文 / 论文 + ChatGPT 之前的真人中文长文
# 只能在 Actions 页面手动运行；结果提交到 server/tools/data/gen_zh/
name: 生成中文 AI 训练数据

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "只用这几家（逗号分隔，如 doubao,qwen；留空 = 全部）"
        default: ""
      n_titles:
        description: "每家模型生成多少篇"
        default: "120"

permissions:
  contents: write

concurrency:
  group: gen-chinese-${{ github.event.inputs.providers }}
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: 生成
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY || secrets.MOONSHOT_API_KEY }}
          WENXIN_API_KEY: ${{ secrets.WENXIN_API_KEY || secrets.APIKey_20260930163541 || secrets.APIKEY_20260930163541 }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY || secrets.QWEN_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY || secrets.ARK_API_KEY }}
          DOUBAO_MODEL: ${{ secrets.DOUBAO_MODEL }}
          ONLY_PROVIDERS: ${{ github.event.inputs.providers }}
        run: |
          for v in DEEPSEEK_API_KEY KIMI_API_KEY WENXIN_API_KEY DASHSCOPE_API_KEY DOUBAO_API_KEY; do
            if [ -n "${!v}" ]; then echo "::notice title=$v::已设置"; else echo "::notice title=$v::未设置"; fi
          done
          python -u server/tools/gen_chinese_ai.py --n-titles "${{ github.event.inputs.n_titles || '120' }}" --time-budget-min 270 ${{ github.event.inputs.providers && '--skip-human' || '' }}
      - name: 提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/tools/data/gen_zh
          git commit -m "Add generated Chinese AI training data [skip ci]" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
