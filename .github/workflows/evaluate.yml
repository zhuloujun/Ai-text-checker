# 用公开数据集（NLPCC 2025 中文 AI 文本检测）评估检测效果，并生成默认校准参数。
# 结果写回仓库：server/app/default_calibration.json、server/tools/EVAL_REPORT.md
# 触发：修改 server/tools/ 下的文件并推送，或在 Actions 页面手动运行。
name: 评估并生成默认校准

on:
  push:
    branches: [main]
    paths:
      - "server/tools/**"
      - ".github/workflows/evaluate.yml"
  workflow_dispatch:
    inputs:
      n_cal:
        description: "校准集段数"
        default: "900"
      n_test:
        description: "测试集段数"
        default: "600"

permissions:
  contents: write

concurrency:
  group: evaluate
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: 安装依赖
        run: |
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r server/requirements.txt
      - name: 缓存模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-qwen05-mpu-zhv3
      - name: 下载模型
        working-directory: server
        run: python download_models.py Qwen/Qwen2.5-0.5B Qwen/Qwen2.5-0.5B-Instruct yuchuantian/AIGC_detector_zhv3
      - name: 下载数据集（NLPCC 2025 Task 1）
        run: git clone --depth 1 https://github.com/NLP2CT/NLPCC-2025-Task1 /tmp/nlpcc
      - name: 评估并拟合校准参数
        working-directory: server
        env:
          TORCH_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python tools/evaluate.py --data /tmp/nlpcc/data \
            --n-cal "${{ github.event.inputs.n_cal || '900' }}" \
            --n-test "${{ github.event.inputs.n_test || '600' }}" \
            --target-fpr 0.05
      - name: 把结果提交回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app/default_calibration.json server/tools/EVAL_REPORT.md server/tools/eval_result.json
          git commit -m "Update default calibration from NLPCC 2025 evaluation" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
