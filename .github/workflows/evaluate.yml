# 用公开数据集评估检测效果，并为四种文体（现代汉语 / 英文 / 文言 / 诗词）分别生成默认校准参数。
#   现代汉语：NLPCC 2025 Task 1（长段 + 截短的短段）；英文：MAGE；文言：NiuTrans 古文语料 + 仓库自带的 AI 文言样本；
#   诗词：ChangAn（ACL 2026）
# 打分分成多份在多台机器上并行，最后汇总拟合；结果写回仓库：
#   server/app/default_calibration.json、server/tools/EVAL_REPORT.md、server/tools/scores/*.json
# 触发：修改 server/tools/ 下的文件并推送（只重新打分英文和文言；现代汉语沿用已提交的打分结果），
#       或在 Actions 页面手动运行（可选择全部重新打分）。
#   推送时只重新打分 PUSH_PARTS 里列出的几份（其余沿用 server/tools/scores 里已提交的结果）。
name: 评估并生成默认校准

on:
  push:
    branches: [main]
    paths:
      - "server/tools/*.py"
      - "server/tools/data/**"
      - "!server/tools/train_poetry.py"
      - "!server/tools/train_classical.py"
      - "!server/tools/train_poetry2.py"
      - "!server/tools/compare_experiment.py"
      - ".github/workflows/evaluate.yml"
  workflow_dispatch:
    inputs:
      include_zh:
        description: "全部重新打分（含现代汉语长段、英文、文言，约 2–3 小时）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: evaluate
  cancel-in-progress: true

env:
  N_CAL: "800"
  N_TEST: "400"
  N_CSL: "240"
  N_EN_CAL: "600"
  N_EN_TEST: "300"
  N_CL_HUMAN: "240"
  N_CL_HUMAN_TEST: "160"
  N_PO_CAL: "800"
  N_PO_TEST: "600"
  PUSH_PARTS: '["en_cal1","en_cal2","en_ood","en_para","en_user"]'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - id: p
        run: |
          if [ "${{ github.event.inputs.include_zh }}" = "true" ]; then
            echo 'parts=["cal1","cal2","test","csl","cal1s","cal2s","tests","en_cal1","en_cal2","en_ood","en_para","cl_cal","cl_test","po_cal","po_test","po_story","po_classic","cl_user","po_user","en_user"]' >> "$GITHUB_OUTPUT"
          else
            echo "parts=$PUSH_PARTS" >> "$GITHUB_OUTPUT"
          fi

  score:
    name: 打分 ${{ matrix.part }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: 安装依赖
        run: |
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r server/requirements.txt openpyxl opencc-python-reimplemented
      - name: 缓存模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-qwen05-mpu-zhv3-desklib
      - name: 下载模型
        working-directory: server
        run: python download_models.py Qwen/Qwen2.5-0.5B Qwen/Qwen2.5-0.5B-Instruct yuchuantian/AIGC_detector_zhv3 desklib/ai-text-detector-v1.01
      - name: 下载数据集（现代汉语：NLPCC 2025 Task 1）
        if: ${{ !startsWith(matrix.part, 'en_') && !startsWith(matrix.part, 'cl_') && !startsWith(matrix.part, 'po_') }}
        run: git clone --depth 1 https://github.com/NLP2CT/NLPCC-2025-Task1 /tmp/nlpcc
      - name: 下载数据集（英文：MAGE）
        if: ${{ startsWith(matrix.part, 'en_') }}
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          for f in ["test.csv", "test_ood_set_gpt.csv", "test_ood_set_gpt_para.csv"]:
              print(hf_hub_download("yaful/MAGE", f, repo_type="dataset", local_dir="/tmp/mage"))
          PY
      - name: 下载数据集（诗词：ChangAn）和诗词分类器（本仓库 Release）
        if: ${{ startsWith(matrix.part, 'po_') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 https://github.com/VelikayaScarlet/ChangAn /tmp/changan
          git clone --depth 1 --filter=blob:none --sparse https://github.com/chinese-poetry/chinese-poetry /tmp/cpoetry
          (cd /tmp/cpoetry && git sparse-checkout set --no-cone "/全唐诗/唐诗三百首.json" "/宋词/宋词三百首.json")
          gh release download poetry-classifier-v1 -p poetry-classifier.tar.gz -D /tmp -R "${{ github.repository }}"
          tar xzf /tmp/poetry-classifier.tar.gz -C /tmp
          ls /tmp/poetry-classifier
          echo "POETRY_CLASSIFIER_MODEL=/tmp/poetry-classifier" >> "$GITHUB_ENV"
      - name: 下载数据集（文言：NiuTrans 古文语料，只取用到的书）
        if: ${{ startsWith(matrix.part, 'cl_') }}
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/NiuTrans/Classical-Modern /tmp/classical
          cd /tmp/classical
          git sparse-checkout set --no-cone $(python3 - <<'PY'
          import sys; sys.path.insert(0, "${{ github.workspace }}/server/tools")
          from evaluate import CLASSICAL_CAL_BOOKS, CLASSICAL_TEST_BOOKS
          print(" ".join(f"/古文原文/{b}/" for b in CLASSICAL_CAL_BOOKS + CLASSICAL_TEST_BOOKS))
          PY
          )
          ls 古文原文 | head -40
      - name: 下载文言分类器（本仓库 Release；还没训练出来时文言沿用通用中文分类器）
        if: ${{ startsWith(matrix.part, 'cl_') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download classical-classifier-v3 -p classical-classifier.tar.gz -D /tmp -R "${{ github.repository }}"; then
            tar xzf /tmp/classical-classifier.tar.gz -C /tmp
            echo "CLASSICAL_CLASSIFIER_MODEL=/tmp/classical-classifier" >> "$GITHUB_ENV"
          fi
      - name: 打分
        working-directory: server
        env:
          TORCH_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python tools/evaluate.py --stage score --part ${{ matrix.part }} --data /tmp/nlpcc/data \
            --mage-dir /tmp/mage --classical-dir /tmp/classical --changan-dir /tmp/changan --cpoetry-dir /tmp/cpoetry --scores-dir /tmp/scores \
            --n-cal $N_CAL --n-test $N_TEST --n-csl $N_CSL --n-en-cal $N_EN_CAL --n-en-test $N_EN_TEST \
            --n-cl-human $N_CL_HUMAN --n-cl-human-test $N_CL_HUMAN_TEST --n-po-cal $N_PO_CAL --n-po-test $N_PO_TEST
      - uses: actions/upload-artifact@v4
        with:
          name: scores-${{ matrix.part }}
          path: /tmp/scores/${{ matrix.part }}.json

  fit:
    name: 拟合与评估
    needs: score
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy openpyxl opencc-python-reimplemented
      - uses: actions/download-artifact@v4
        with:
          pattern: scores-*
          path: /tmp/dl
          merge-multiple: true
      - name: 拟合校准参数并评估
        working-directory: server
        env:
          OBSERVER_MODEL: Qwen/Qwen2.5-0.5B
          PERFORMER_MODEL: Qwen/Qwen2.5-0.5B-Instruct
          CLASSIFIER_MODEL: yuchuantian/AIGC_detector_zhv3
          EN_CLASSIFIER_MODEL: desklib/ai-text-detector-v1.01
          POETRY_CLASSIFIER_MODEL: /tmp/poetry-classifier
        run: |
          mkdir -p tools/scores && cp /tmp/dl/*.json tools/scores/ && ls -la tools/scores
          # 文言各份的打分里带有通用分类器第二意见（classifier_mpu）时，说明是用文言分类器打的分
          if python3 -c "import json,sys; r=json.load(open('tools/scores/cl_cal.json')); sys.exit(0 if r and 'classifier_mpu' in r[0]['s'] else 1)"; then
            export CLASSICAL_CLASSIFIER_MODEL=/tmp/classical-classifier
            echo "文言按文言分类器拟合"
          fi
          python tools/evaluate.py --stage fit --scores-dir tools/scores --target-fpr 0.05
      - name: 把结果提交回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 先把结果放到一边，基于最新的 main 再提交，避免与期间的其他提交冲突
          mkdir -p /tmp/result && cp -r server/app/default_calibration.json server/app/calib_data server/tools/EVAL_REPORT.md server/tools/eval_result.json server/tools/scores /tmp/result/
          git fetch origin main && git reset --hard origin/main
          cp /tmp/result/default_calibration.json server/app/ && cp /tmp/result/EVAL_REPORT.md /tmp/result/eval_result.json server/tools/
          mkdir -p server/tools/scores && cp /tmp/result/scores/*.json server/tools/scores/
          mkdir -p server/app/calib_data && cp /tmp/result/calib_data/*.json server/app/calib_data/
          git add server/app/default_calibration.json server/app/calib_data server/tools/EVAL_REPORT.md server/tools/eval_result.json server/tools/scores
          git commit -m "Update default calibration (modern Chinese, English, classical Chinese, poetry)" || exit 0
          git push origin HEAD:main
