# 备用：把 server/ 同步到 Hugging Face Space。
# Hugging Face 自 2026 年 7 月起要求 PRO 订阅才能在 CPU 上运行 Docker Space，
# 所以这里改为只能手动运行（Actions 页面 → Run workflow）。开通 PRO 后可以使用。
name: （备用）部署到 Hugging Face Space

on:
  workflow_dispatch:

concurrency:
  group: deploy-hf-space
  cancel-in-progress: false

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: 安装依赖
        run: |
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r server/requirements.txt pytest httpx
      - name: 运行测试（用随机小模型检查流程与公式）
        working-directory: server
        run: |
          python tests/make_tiny_models.py /tmp/tiny
          TEST_MODELS_DIR=/tmp/tiny python -m pytest -q
      - name: 检查网页脚本语法
        run: node --check server/static/app.js && node --check server/static/admin.js

  deploy:
    name: 同步到 Space
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub==0.36.2"
      - name: 同步 server/ → Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ADMIN_TOKEN: ${{ secrets.HF_ADMIN_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::未设置 HF_TOKEN，已跳过同步。设置方法见仓库首页 README 的「一次性设置 A」。"
            exit 0
          fi
          python .github/scripts/sync_hf_space.py
